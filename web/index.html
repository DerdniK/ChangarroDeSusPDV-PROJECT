<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles/login.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MachaPoint - Login</title>
</head>


<body>

  <main class="login-card">

    <h1>¡Bienvenido MachaPoint!</h1>
    <p>Inicia sesion 🦝</p>

    <form id="login">
      <div class="input-login">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required placeholder="Ingresa tu usuario" required>
      </div>
    
      <div class="input-login">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña" required>
      </div>
      

      <button type="submit" class="login-button">Iniciar Sesión</button>

      <p id="mensaje"></p>

    </form>

  </main>



<script src="js/login.js"></script>
