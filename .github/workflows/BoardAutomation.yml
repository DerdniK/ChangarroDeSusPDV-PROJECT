name: Complete Board Automation (Backlog, ToDo, Done & Auto-Close)

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  automate-board:
    runs-on: ubuntu-latest
    steps:
      - name: Procesar tablero y reglas de Sub-Issues
        uses: actions/github-script@v7
        env:
          PROJECT_OWNER: "DerdniK"      # Tu usuario u organización
          PROJECT_NUMBER: 2            # Número de tu Project Board
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;
            const action = context.payload.action;
            const projectOwner = process.env.PROJECT_OWNER;
            const projectNumber = parseInt(process.env.PROJECT_NUMBER);

            const normalize = (text) => (text || "").toString().toLowerCase().replace(/[^a-z0-9]/g, "");

            // 1. Consultar GraphQL para identificar la jerarquía y etiquetas
            const issueDetailsQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id
                    number
                    labels(first: 20) {
                      nodes { name }
                    }
                    parent {
                      id
                      number
                    }
                    subIssues(first: 50) {
                      nodes {
                        id
                        number
                        state
                      }
                    }
                  }
                }
              }
            `;

            const issueRes = await github.graphql(issueDetailsQuery, { owner, repo, number: issueNumber });
            const currentIssue = issueRes.repository.issue;
            const isSubIssue = !!currentIssue.parent;

            // 2. Obtener el Proyecto en GitHub Projects V2
            const projectQuery = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 30) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let projectRes;
            try {
              projectRes = await github.graphql(projectQuery, { owner: projectOwner, number: projectNumber });
            } catch(e) {
              const orgQuery = `
                query($owner: String!, $number: Int!) {
                  organization(login: $owner) {
                    projectV2(number: $number) {
                      id
                      fields(first: 30) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              projectRes = await github.graphql(orgQuery, { owner: projectOwner, number: projectNumber });
            }

            const project = projectRes.user ? projectRes.user.projectV2 : projectRes.organization.projectV2;
            const statusField = project.fields.nodes.find(f => f?.name && normalize(f.name) === "status");

            if (!statusField || !statusField.options) {
              console.error("❌ No se encontró el campo 'Status' en el proyecto.");
              return;
            }

            const getOption = (colName) => statusField.options.find(o => o?.name && normalize(o.name) === normalize(colName));

            // Mutaciones GraphQL
            const addMutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item { id }
                }
              }
            `;

            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `;

            const moveItem = async (contentId, columnName) => {
              const option = getOption(columnName);
              if (!option) {
                console.error(`❌ Columna '${columnName}' no encontrada.`);
                return;
              }
              const addRes = await github.graphql(addMutation, { projectId: project.id, contentId });
              const itemId = addRes.addProjectV2ItemById.item.id;

              await github.graphql(updateMutation, {
                projectId: project.id,
                itemId,
                fieldId: statusField.id,
                optionId: option.id
              });
              console.log(`✅ Ítem movido a '${option.name}'.`);
            };

            // Helper para remover etiquetas de forma segura
            const safeRemoveLabel = async (issueNum, labelName) => {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNum, name: labelName });
              } catch (e) {}
            };

            // 3. Lógica de asignación y sincronización
            if (isSubIssue) {
              if (action === "closed") {
                await moveItem(currentIssue.id, "Sub-Issues Done");

                // Lógica 100% Auto-Cierre del Padre
                const parentNumber = currentIssue.parent.number;
                const parentQuery = `
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $number) {
                        id
                        subIssues(first: 50) {
                          nodes { number state }
                        }
                      }
                    }
                  }
                `;
                const parentRes = await github.graphql(parentQuery, { owner, repo, number: parentNumber });
                const parentIssue = parentRes.repository.issue;
                const subIssues = parentIssue.subIssues?.nodes || [];

                const allClosed = subIssues.length > 0 && subIssues.every(s => s.state === "CLOSED");
                
                if (allClosed) {
                  console.log(`🎉 ¡Padre #${parentNumber} completado al 100%! Asignando etiqueta 'done' y cerrando...`);

                  // Limpiar etiquetas anteriores
                  await safeRemoveLabel(parentNumber, 'todo');
                  await safeRemoveLabel(parentNumber, 'backlog');

                  // Asignar etiqueta 'done'
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: parentNumber,
                    labels: ['done']
                  });

                  // Cerrar el Issue Padre
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: parentNumber,
                    state: 'closed'
                  });

                  // Mover a columna 'Issues Done'
                  await moveItem(parentIssue.id, "Issues Done");
                }
              } else {
                // Consultar las etiquetas del Padre para saber si debe ir a ToDo Sub-Issues o Project Sub-Issues
                const parentNumber = currentIssue.parent.number;
                const parentInfoQuery = `
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $number) {
                        labels(first: 20) {
                          nodes { name }
                        }
                      }
                    }
                  }
                `;
                const pRes = await github.graphql(parentInfoQuery, { owner, repo, number: parentNumber });
                const pLabels = pRes.repository.issue.labels?.nodes || [];
                const hasTodoLabel = pLabels.some(l => normalize(l.name) === "todo");

                const targetCol = hasTodoLabel ? "ToDo Sub-Issues" : "Project Sub-Issues";
                await moveItem(currentIssue.id, targetCol);
              }
            } else {
              // ISSUE PRINCIPAL / PADRE
              if (action === "closed") {
                await moveItem(currentIssue.id, "Issues Done");
              } else {
                let labels = (currentIssue.labels?.nodes || []).map(l => normalize(l.name));
                
                // Si recién se crea y no tiene ni 'todo' ni 'backlog', le agregamos 'backlog' por defecto
                if (action === "opened" && !labels.includes("todo") && !labels.includes("backlog")) {
                  console.log(`🏷️ Asignando etiqueta por defecto 'backlog' al Issue #${issueNumber}...`);
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    labels: ['backlog']
                  });
                  labels.push("backlog");
                }

                // Resolver conflicto de etiquetas exclusivas (si tiene 'todo', quita 'backlog' y viceversa)
                if (labels.includes("todo")) {
                  await safeRemoveLabel(issueNumber, 'backlog');
                } else if (labels.includes("backlog")) {
                  await safeRemoveLabel(issueNumber, 'todo');
                }

                const isTodo = labels.includes("todo");
                const parentTargetCol = isTodo ? "ToDo Issues" : "Project Issues";
                const subTargetCol = isTodo ? "ToDo Sub-Issues" : "Project Sub-Issues";

                // Mover el Issue Padre
                await moveItem(currentIssue.id, parentTargetCol);

                // Sincronizar en cascada todas sus Sub-issues activas
                const subIssues = currentIssue.subIssues?.nodes || [];
                if (subIssues.length > 0) {
                  console.log(`⚡ Sincronizando ${subIssues.length} Sub-issues hacia '${subTargetCol}'...`);
                  for (const sub of subIssues) {
                    if (sub.state !== "CLOSED") {
                      await moveItem(sub.id, subTargetCol);
                    }
                  }
                }
              }
            }
