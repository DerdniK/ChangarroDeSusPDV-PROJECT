name: Complete Board Automation (Issues, Sub-Issues & Auto-Close)

on:
  issues:
    types: [opened, closed, reopened]

permissions:
  issues: write
  contents: read

jobs:
  automate-board:
    runs-on: ubuntu-latest
    steps:
      - name: Procesar tablero y reglas de Sub-Issues
        uses: actions/github-script@v7
        env:
          PROJECT_OWNER: "DerdniK"      # Tu usuario u organización
          PROJECT_NUMBER: 1            # Número de tu Project Board (de la URL)
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;
            const action = context.payload.action;
            const projectOwner = process.env.PROJECT_OWNER;
            const projectNumber = parseInt(process.env.PROJECT_NUMBER);

            // 1. Consultar GraphQL para obtener la jerarquía del Issue
            const issueDetailsQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id
                    number
                    parent {
                      id
                      number
                    }
                  }
                }
              }
            `;

            const issueRes = await github.graphql(issueDetailsQuery, { owner, repo, number: issueNumber });
            const currentIssue = issueRes.repository.issue;
            const isSubIssue = !!currentIssue.parent;

            // 2. Determinar la columna de destino
            let targetStatus = "";
            if (isSubIssue) {
              targetStatus = (action === "closed") ? "Sub-Issues Done" : "ToDo Sub-Issues";
            } else {
              targetStatus = (action === "closed") ? "Issues Done" : "ToDo Issues";
            }

            console.log(`📌 Issue #${issueNumber} | Es Sub-Issue: ${isSubIssue} | Evento: ${action} -> Moviendo a '${targetStatus}'`);

            // 3. Obtener el Proyecto en GitHub Projects V2
            const projectQuery = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 30) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let projectRes;
            try {
              projectRes = await github.graphql(projectQuery, { owner: projectOwner, number: projectNumber });
            } catch(e) {
              const orgQuery = `
                query($owner: String!, $number: Int!) {
                  organization(login: $owner) {
                    projectV2(number: $number) {
                      id
                      fields(first: 30) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              projectRes = await github.graphql(orgQuery, { owner: projectOwner, number: projectNumber });
            }

            const project = projectRes.user ? projectRes.user.projectV2 : projectRes.organization.projectV2;
            
            // Función segura de normalización
            const normalize = (text) => (text || "").toString().toLowerCase().replace(/[^a-z0-9]/g, "");
            
            // Buscar el campo 'Status' de forma segura
            const statusField = project.fields.nodes.find(f => f?.name && normalize(f.name) === "status");

            if (!statusField || !statusField.options) {
              console.error("❌ No se encontró el campo 'Status' con opciones válidas en el proyecto.");
              return;
            }

            const normalizedTarget = normalize(targetStatus);
            const statusOption = statusField.options.find(o => o?.name && normalize(o.name) === normalizedTarget);

            if (!statusOption) {
              console.error(`❌ No se encontró la opción '${targetStatus}'. Las opciones disponibles en tu columna Status son:`);
              statusField.options.forEach(o => o?.name && console.log(`   - "${o.name}"`));
              return;
            }

            // 4. Agregar/Actualizar ítem en el proyecto
            const addMutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item { id }
                }
              }
            `;
            const addRes = await github.graphql(addMutation, { projectId: project.id, contentId: currentIssue.id });
            const itemId = addRes.addProjectV2ItemById.item.id;

            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `;

            await github.graphql(updateMutation, {
              projectId: project.id,
              itemId: itemId,
              fieldId: statusField.id,
              optionId: statusOption.id
            });

            console.log(`✅ Issue #${issueNumber} movida con éxito a '${statusOption.name}'.`);

            // 5. LÓGICA 100%: Si se cerró una Sub-Issue, verificar si el Padre completó todas sus Sub-Issues
            if (isSubIssue && action === "closed") {
              const parentNumber = currentIssue.parent.number;
              console.log(`🔍 Verificando Sub-Issues restantes del Padre #${parentNumber}...`);

              const parentQuery = `
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      id
                      subIssues(first: 50) {
                        nodes {
                          number
                          state
                        }
                      }
                    }
                  }
                }
              `;

              const parentRes = await github.graphql(parentQuery, { owner, repo, number: parentNumber });
              const parentIssue = parentRes.repository.issue;
              const subIssues = parentIssue.subIssues?.nodes || [];

              const allClosed = subIssues.length > 0 && subIssues.every(sub => sub.state === "CLOSED");

              if (allClosed) {
                console.log(`🎉 ¡Todas las Sub-Issues de #${parentNumber} están cerradas (100%)! Cerrando Issue Padre...`);

                // A. Cerrar el Issue Padre
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: parentNumber,
                  state: 'closed'
                });

                // B. Mover el Issue Padre a 'Issues Done'
                const parentDoneTarget = normalize("Issues Done");
                const parentDoneOption = statusField.options.find(o => o?.name && normalize(o.name) === parentDoneTarget);

                if (parentDoneOption) {
                  const parentAddRes = await github.graphql(addMutation, { projectId: project.id, contentId: parentIssue.id });
                  const parentItemId = parentAddRes.addProjectV2ItemById.item.id;

                  await github.graphql(updateMutation, {
                    projectId: project.id,
                    itemId: parentItemId,
                    fieldId: statusField.id,
                    optionId: parentDoneOption.id
                  });

                  console.log(`✅ Issue Padre #${parentNumber} cerrado automáticamente y movido a '${parentDoneOption.name}'.`);
                }
              } else {
                console.log(`El Issue Padre #${parentNumber} aún tiene tareas pendientes.`);
              }
            }
