name: Complete Board Automation (Issues, Sub-Issues & Auto-Close)

on:
  issues:
    types: [opened, closed, reopened, edited]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  automate-board:
    runs-on: ubuntu-latest
    steps:
      - name: Procesar tablero y reglas de Sub-Issues
        uses: actions/github-script@v7
        env:
          PROJECT_OWNER: "DerdniK"      # Tu usuario u organización
          PROJECT_NUMBER: 2            # Número de tu Project Board (de la URL)
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;
            const action = context.payload.action;
            const projectOwner = process.env.PROJECT_OWNER;
            const projectNumber = parseInt(process.env.PROJECT_NUMBER);

            const normalize = (text) => (text || "").toString().toLowerCase().replace(/[^a-z0-9]/g, "");

            // 1. Consultar GraphQL para identificar si es Sub-Issue
            const issueDetailsQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id
                    number
                    parent {
                      id
                      number
                    }
                  }
                }
              }
            `;

            const issueRes = await github.graphql(issueDetailsQuery, { owner, repo, number: issueNumber });
            const currentIssue = issueRes.repository.issue;
            const isSubIssue = !!currentIssue.parent;

            // 2. Obtener el Proyecto en GitHub Projects V2
            const projectQuery = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 30) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let projectRes;
            try {
              projectRes = await github.graphql(projectQuery, { owner: projectOwner, number: projectNumber });
            } catch(e) {
              const orgQuery = `
                query($owner: String!, $number: Int!) {
                  organization(login: $owner) {
                    projectV2(number: $number) {
                      id
                      fields(first: 30) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options { id name }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              projectRes = await github.graphql(orgQuery, { owner: projectOwner, number: projectNumber });
            }

            const project = projectRes.user ? projectRes.user.projectV2 : projectRes.organization.projectV2;
            const statusField = project.fields.nodes.find(f => f?.name && normalize(f.name) === "status");

            if (!statusField || !statusField.options) {
              console.error("❌ No se encontró el campo 'Status' con opciones válidas.");
              return;
            }

            const getOption = (colName) => statusField.options.find(o => o?.name && normalize(o.name) === normalize(colName));

            // Mutaciones GraphQL
            const addMutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item { id }
                }
              }
            `;

            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `;

            const moveItem = async (contentId, columnName) => {
              const option = getOption(columnName);
              if (!option) {
                console.error(`❌ No existe la columna '${columnName}'`);
                return;
              }
              const addRes = await github.graphql(addMutation, { projectId: project.id, contentId });
              const itemId = addRes.addProjectV2ItemById.item.id;

              await github.graphql(updateMutation, {
                projectId: project.id,
                itemId,
                fieldId: statusField.id,
                optionId: option.id
              });
              console.log(`✅ Movido a '${option.name}'.`);
            };

            // 3. Determinar columna según jerarquía
            if (isSubIssue) {
              if (action === "closed") {
                await moveItem(currentIssue.id, "Sub-Issues Done");

                // Lógica de 100% de auto-cierre
                const parentNumber = currentIssue.parent.number;
                const parentQuery = `
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $number) {
                        id
                        subIssues(first: 50) {
                          nodes { number state }
                        }
                      }
                    }
                  }
                `;
                const parentRes = await github.graphql(parentQuery, { owner, repo, number: parentNumber });
                const parentIssue = parentRes.repository.issue;
                const subIssues = parentIssue.subIssues?.nodes || [];

                const allClosed = subIssues.length > 0 && subIssues.every(s => s.state === "CLOSED");
                if (allClosed) {
                  console.log(`🎉 ¡Padre #${parentNumber} completado al 100%! Cerrando...`);
                  await github.rest.issues.update({ owner, repo, issue_number: parentNumber, state: 'closed' });
                  await moveItem(parentIssue.id, "Issues Done");
                }
              } else {
                // Consultar estado actual del Padre
                const parentNumber = currentIssue.parent.number;
                let targetCol = "Project Sub-Issues";

                const parentItemQuery = `
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $number) {
                        projectItems(first: 5) {
                          nodes {
                            fieldValueByName(name: "Status") {
                              ... on ProjectV2ItemFieldSingleSelectValue {
                                name
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `;
                const pRes = await github.graphql(parentItemQuery, { owner, repo, number: parentNumber });
                const pItem = pRes.repository.issue.projectItems?.nodes?.[0];
                const pStatus = pItem?.fieldValueByName?.name;

                if (pStatus && normalize(pStatus) === normalize("ToDo Issues")) {
                  targetCol = "ToDo Sub-Issues";
                }

                await moveItem(currentIssue.id, targetCol);
              }
            } else {
              // Issue Principal
              if (action === "closed") {
                await moveItem(currentIssue.id, "Issues Done");
              } else {
                await moveItem(currentIssue.id, "Project Issues");
              }
            }
