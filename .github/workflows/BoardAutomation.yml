name: Sub-Issues Project Board Automation

on:
  issues:
    types: [opened, closed, reopened]

jobs:
  manage-sub-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar estado en GitHub Projects
        uses: actions/github-script@v7
        env:
          # ⚙️ CONFIGURA AQUÍ TU USUARIO/ORGANIZACIÓN Y NÚMERO DE PROYECTO
          PROJECT_OWNER: "DerdniK"      # Tu usuario u organización en GitHub
          PROJECT_NUMBER: 2            # Número de tu Project Board (sale en la URL)
        with:
          # Requiere un Personal Access Token (PAT) con permisos 'project' guardado en Secrets
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action;

            // 1. Verificar si el issue es una Sub-Issue
            // Detecta si tiene un issue padre asociado o la etiqueta 'sub-issue'
            const isSubIssue = issue.parent_issue_url || 
                               (issue.labels && issue.labels.some(l => l.name.toLowerCase().includes('sub-issue')));

            if (!isSubIssue) {
              console.log(`El issue #${issue.number} es un Issue principal. Se omite de esta automatización.`);
              return;
            }

            // 2. Determinar la columna/estado destino según el evento
            let targetStatus = "";
            if (action === "opened" || action === "reopened") {
              targetStatus = "ToDo Sub-Issues";
            } else if (action === "closed") {
              targetStatus = "Sub-Issues Done";
            }

            console.log(`Procesando Sub-Issue #${issue.number} (${action}) -> Moviendo a: '${targetStatus}'`);

            const owner = process.env.PROJECT_OWNER;
            const projectNumber = parseInt(process.env.PROJECT_NUMBER);

            // 3. Obtener los IDs del Proyecto y sus campos mediante GraphQL
            const projectQuery = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectRes = await github.graphql(projectQuery, { owner, number: projectNumber });
            const project = projectRes.user.projectV2;
            const statusField = project.fields.nodes.find(f => f.name === "Status");
            const statusOption = statusField ? statusField.options.find(o => o.name === targetStatus) : null;

            if (!statusField || !statusOption) {
              console.error(`No se encontró el campo 'Status' o la opción '${targetStatus}' en el proyecto.`);
              return;
            }

            // 4. Agregar la Sub-Issue al Proyecto V2
            const addMutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemByComponent(input: {projectId: $projectId, contentId: $contentId}) {
                  item { id }
                }
              }
            `;

            const addRes = await github.graphql(addMutation, {
              projectId: project.id,
              contentId: issue.node_id
            });

            const itemId = addRes.addProjectV2ItemByComponent.item.id;

            // 5. Actualizar la columna Status a 'ToDo Sub-Issues' o 'Sub-Issues Done'
            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `;

            await github.graphql(updateMutation, {
              projectId: project.id,
              itemId: itemId,
              fieldId: statusField.id,
              optionId: statusOption.id
            });

            console.log(`✅ Sub-Issue #${issue.number} movida exitosamente a '${targetStatus}'.`);
